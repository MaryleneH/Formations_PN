# =====================================================================
# Publication du site « Git — Le bac à sable » avec GitLab Pages.
#
# Version minimale de GitLab : 17.9 (mot-clé `pages.publish` sous `pages`).
# Le nom libre du job de publication fonctionne depuis GitLab 17.6.
# Le dossier `_site` est ajouté explicitement aux artefacts : à partir de
# GitLab 17.10, `pages.publish` l'ajoute aussi automatiquement.
#
# Images vérifiées le 5 novembre 2026 :
#   - ghcr.io/quarto-dev/quarto:1.10.20 (tag présent dans le registre GHCR) ;
#   - node:22-bookworm-slim (Docker Hub).
# Voir docs/PUBLICATION.md pour la synchronisation GitHub → GitLab.
# =====================================================================

stages:
  - test
  - deploy

variables:
  QUARTO_IMAGE: "ghcr.io/quarto-dev/quarto:1.10.20"

# Tests du moteur de simulation (Node, sans navigateur).
moteur:
  stage: test
  image: node:22-bookworm-slim
  script:
    - node --version
    - node --test tests/*.test.js
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Rendu et contrôles du site, sur toutes les branches (sans publication).
rendu:
  stage: test
  image:
    name: $QUARTO_IMAGE
    entrypoint: [""]   # précaution : on veut un shell, quel que soit le point d'entrée de l'image
  script:
    - quarto --version
    - quarto render
    - sh tests/check-site.sh _site
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Publication : uniquement sur la branche par défaut.
publier-site:
  stage: deploy
  image:
    name: $QUARTO_IMAGE
    entrypoint: [""]
  script:
    - quarto --version
    - quarto render
    - sh tests/check-site.sh _site
  pages:
    publish: _site
  artifacts:
    paths:
      - _site
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
